<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Diopsis — a baseline render and the current one, and the lens that shows what moved between them">
  <title>Diopsis</title>
  <desc>Two renders of the same story side by side. Between them the overlap of two
        circles forms a lens: the difference is what you look through.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182029"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bf63"/>
      <stop offset="1" stop-color="#e8951f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="640" height="300" rx="18"/>
    </clipPath>
    <!-- The lens is exactly the intersection of the two circles: what one render has
         and the other does not. Clipping one by the other draws that set literally. -->
    <clipPath id="right-circle">
      <circle cx="341" cy="150" r="42"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="300" fill="url(#bg)"/>

    <!-- LEFT: the baseline, committed in the repository -->
    <g>
      <rect x="60" y="62" width="176" height="176" rx="11" fill="#1b232c" stroke="#2c3742" stroke-width="2"/>
      <rect x="60" y="62" width="176" height="30" rx="11" fill="#222b35"/>
      <rect x="60" y="81" width="176" height="11" fill="#222b35"/>
      <g fill="#46525f">
        <rect x="76" y="72" width="52" height="9" rx="4.5"/>
        <rect x="76" y="112" width="118" height="8" rx="4"/>
        <rect x="76" y="134" width="144" height="7" rx="3.5" opacity="0.72"/>
        <rect x="76" y="152" width="126" height="7" rx="3.5" opacity="0.72"/>
        <rect x="76" y="170" width="138" height="7" rx="3.5" opacity="0.72"/>
      </g>
      <rect x="76" y="196" width="62" height="24" rx="7" fill="#2b3540"/>
    </g>

    <!-- CENTRE: the comparison itself — two renders, and the lens their overlap makes -->
    <g fill="none" stroke="#3d4753" stroke-width="6">
      <circle cx="299" cy="150" r="42"/>
      <circle cx="341" cy="150" r="42"/>
    </g>
    <g clip-path="url(#right-circle)">
      <circle cx="299" cy="150" r="42" fill="url(#lens)"/>
    </g>
    <circle cx="320" cy="150" r="13.5" fill="#0d1117"/>
    <circle cx="320" cy="150" r="5.5" fill="#f7bf63"/>

    <!-- RIGHT: the current render — same story, one row grown, and that is the finding -->
    <g>
      <rect x="404" y="62" width="176" height="176" rx="11" fill="#1b232c" stroke="#2c3742" stroke-width="2"/>
      <rect x="404" y="62" width="176" height="30" rx="11" fill="#222b35"/>
      <rect x="404" y="81" width="176" height="11" fill="#222b35"/>
      <g fill="#46525f">
        <rect x="420" y="72" width="52" height="9" rx="4.5"/>
        <rect x="420" y="112" width="118" height="8" rx="4"/>
      </g>
      <!-- the changed band, marked the way a diff marks it -->
      <rect x="412" y="127" width="160" height="24" rx="6" fill="#e8951f" opacity="0.16"/>
      <rect x="420" y="135" width="144" height="7" rx="3.5" fill="#f7bf63"/>
      <g fill="#46525f">
        <rect x="420" y="160" width="126" height="7" rx="3.5" opacity="0.72"/>
        <rect x="420" y="178" width="138" height="7" rx="3.5" opacity="0.72"/>
      </g>
      <rect x="420" y="204" width="62" height="24" rx="7" fill="#2b3540"/>
    </g>
  </g>
</svg>
